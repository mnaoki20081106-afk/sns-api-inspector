name: Inspect public page network metadata
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public page URL you are authorized to inspect (no login or payment bypass)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect page metadata
        env:
          TARGET_URL: \${{ inputs.target_url }}
        run: node src/inspect.js "$TARGET_URL"
      - name: Upload metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-report
          path: artifacts/network-report.json
          if-no-files-found: ignore
          retention-days: 7
